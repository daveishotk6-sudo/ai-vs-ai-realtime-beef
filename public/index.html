<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI vs AI Beef</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(90deg, #1a1a2e, #16213e);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    h1 {
      font-size: 1.4rem;
      background: linear-gradient(90deg, #ff6b6b, #feca57);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .controls button {
      background: #e94560;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 10px;
      transition: 0.2s;
    }
    .controls button:hover { background: #ff6b6b; }
    .controls button:disabled { background: #555; cursor: not-allowed; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.4;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ai1 {
      align-self: flex-start;
      background: #1e3a5f;
      border-bottom-left-radius: 4px;
    }
    .ai2 {
      align-self: flex-end;
      background: #4a1c40;
      border-bottom-right-radius: 4px;
    }
    .speaker {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      opacity: 0.8;
    }
    .ai1 .speaker { color: #7eb8ff; }
    .ai2 .speaker { color: #ff9ece; }
    #status {
      padding: 10px 20px;
      background: #1a1a2e;
      font-size: 0.85rem;
      color: #aaa;
      border-top: 1px solid #333;
    }
    .beef { 
      background: linear-gradient(90deg, #5c1a1a, #3d0f0f) !important;
      border: 1px solid #e94560;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔥 AI vs AI Realtime Beef</h1>
    <div class="controls">
      <button id="startBtn">Start Conversation</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
  </header>

  <div id="chat"></div>
  <div id="status">Ready. Set your two OpenRouter keys in Railway env vars and hit Start.</div>

  <script>
    const socket = io();
    const chat = document.getElementById('chat');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    startBtn.onclick = () => {
      chat.innerHTML = '';
      startBtn.disabled = true;
      stopBtn.disabled = false;
      status.textContent = 'Conversation starting...';
      socket.emit('start');
    };

    stopBtn.onclick = () => {
      socket.emit('stop');
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };

    socket.on('message', (data) => {
      const div = document.createElement('div');
      div.className = `msg ${data.speaker.toLowerCase().replace('-', '')}`;
      if (data.turn >= 8) div.classList.add('beef');
      div.innerHTML = `<div class="speaker">${data.speaker} ${data.turn >= 8 ? '💢' : ''}</div>${data.text}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      status.textContent = `Turn ${data.turn} — ${data.speaker} just spoke`;
    });

    socket.on('error', (data) => {
      status.textContent = 'Error: ' + data.message;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    socket.on('done', (data) => {
      status.textContent = data.message;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });
  </script>
</body>
</html>
